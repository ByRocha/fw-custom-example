	fuelAlgorithm = "Determina o método utilizado para calcular o fornecimento de combustível. As seguintes opções estão disponíveis: Usa a pressão do coletor de admissão (MAP) e a temperatura do ar de admissão (IAT) para calcular a densidade do ar e os requisitos de combustível. Esta é uma estratégia comum, especialmente para motores naturalmente aspirados ou turboalimentados. Alpha-N: Usa a posição do acelerador como entrada de carga primária para o cálculo do combustível. Esta estratégia é geralmente usada em motores com borboletas individuais ou aqueles que não possuem um sinal MAP confiável. Carga de ar MAF: Baseia-se em um sensor de fluxo de massa de ar (MAF) para medir diretamente a quantidade de ar que entra no motor, tornando-o eficaz para motores equipados com um sensor MAF. Lua: Permite cálculos de combustível personalizados usando scripts Lua, possibilitando aplicações de ajuste altamente específicas onde as outras estratégias não se aplicam."
