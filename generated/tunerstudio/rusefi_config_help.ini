[SettingContextHelp]
	maxAdd = "Maximum % that the short term fuel trim can add"
	maxRemove = "Maximum % that the short term fuel trim can remove"
	timeConstant = "Commonly referred as Integral gain.\nTime constant for correction while in this cell: this sets responsiveness of the closed loop correction. A value of 5.0 means it will try to make most of the correction within 5 seconds, and a value of 1.0 will try to correct within 1 second.\nLower values makes the correction more sensitive, higher values slow the correction down."
	maxIdleRegionRpm = "Below this RPM, the idle region is active, idle+300 would be a good value"
	maxOverrunLoad = "Below this engine load, the overrun region is active\nWhen tuning by MAP the units are kPa/psi, e.g. 30 would mean 30kPa. When tuning TPS, 30 would be 30%"
	minPowerLoad = "Above this engine load, the power region is active\nWhen tuning by MAP the units are kPa/psi"
	deadband = "When close to correct AFR, pause correction. This can improve stability by not changing the adjustment if the error is extremely small, but is not required."
	minClt = "Minimum coolant temperature before closed loop operation is allowed."
	minAfr = "Below this AFR, correction is paused"
	maxAfr = "Above this AFR, correction is paused"
	startupDelay = "Time after startup before closed loop operation is allowed."
	enabled = "Enables lambda sensor long term fuel corrections data gathering into LTFT trim tables"
	correctionEnabled = "Apply LTFT trims into fuel calculation on top of VE table.\nWe do not adjust VE table automatically, please click 'Apply to VE' if you want to adjust your VE tables and reset trims."
	offset = "Linear addition to PID logic\nAlso known as feedforward."
	periodMs = "PID dTime"
	minValue = "Output Min Duty Cycle"
	maxValue = "Output Max Duty Cycle"
	rpm = "This sets the RPM limit below which the ECU will use cranking fuel and ignition logic, typically this is around 350-450rpm. \nset cranking_rpm X"
	pin = "Select a pin to use for PWM or on-off output."
	dutyIfError = "If an error (with a sensor, etc) is detected, this value is used instead of reading from the table.\nThis should be a safe value for whatever hardware is connected to prevent damage."
