	injectionMode = "É aqui que o tipo de injeção de combustível é definido: 'Simultâneo' significa que todos os bicos injetores dispararão juntos de uma vez. 'Sequencial' dispara os bicos injetores por cilindro, o que requer bicos injetores conectados individualmente. 'Em grupo' disparará os bicos injetores em grupos."
	crankingTimingAngle = "Ângulo de avanço de ignição usado durante a partida do motor, 5-10 graus funcionará como uma configuração base para a maioria dos motores.\nHá uma transição suave para o ponto de ignição de funcionamento.\nDefinir cranking_timing_angle X"
	ignitionMode = "Bobina única = distribuidor\nBobinas individuais = uma bobina por cilindro (COP, bobina-quase-vela), requer modo sequencial\nFaísca perdida = Dispara pares de cilindros juntos, uma bobina por par de cilindros ou uma bobina por cilindro\nDois distribuidores = Um par de distribuidores, encontrado em alguns motores BMW, Toyota e outros\nset ignition_mode X"
