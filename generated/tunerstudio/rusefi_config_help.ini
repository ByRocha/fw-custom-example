	cylinderBore = "@@CYLINDER_BORE_TOOLTIP@@"
	fuelAlgorithm = "Determina o método usado para calcular o fornecimento de combustível. As seguintes opções estão disponíveis: MAP (Pressão Absoluta do Coletor): Usa a pressão do coletor de admissão e a temperatura do ar de admissão (IAT) para calcular a densidade do ar e os requisitos de combustível. Esta é uma estratégia comum, especialmente para motores aspirados ou turboalimentados. Alpha-N: Usa a posição da borboleta como entrada de carga primária para o cálculo de combustível. Esta estratégia é geralmente usada em motores com borboletas individuais ou aqueles que não possuem um sinal MAP confiável. Carga de Ar MAF: Depende de um sensor de Fluxo de Massa de Ar (MAF) para medir a quantidade de ar que entra no motor diretamente, tornando-o eficaz para motores equipados com um sensor MAF. Lua: Permite cálculos de combustível personalizados usando scripts Lua, possibilitando aplicações de ajuste altamente específicas onde as outras estratégias não se aplicam."
