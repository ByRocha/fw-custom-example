	maintainConstantValue = etb_pFactor, { (calibrationMode == @@TsCalMode_EtbKp@@ ) ? calibrationValue : etb_pFactor }
	maintainConstantValue = etb_iFactor, { (calibrationMode == @@TsCalMode_EtbKi@@ ) ? calibrationValue : etb_iFactor }
