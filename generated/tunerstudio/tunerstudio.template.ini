	wb1hasFault = { enableAemXSeries && ((wb1stateCode >= 3 && wb1stateCode <= 5) || !wb1isValid) }

; calculated values by metric/imperial units
; "useMetricOnInterface" controls whether metric or imperial units are displayed
; Temperature: C to F = * 1.8 + 32
; Pressure: kPa to psi = * 0.145038
; Speed: kph to mph = * 0.62137119

	; Temperature output channels with metric/imperial support
	coolantTemperature = { useMetricOnInterface ? coolant : (coolant * 1.8 + 32) }
	intakeTemperature = { useMetricOnInterface ? intake : (intake * 1.8 + 32) }
	OilTemp = { useMetricOnInterface ? oilTemp : (oilTemp * 1.8 + 32) }
	AuxTemp1 = { useMetricOnInterface ? auxTemp1 : (auxTemp1 * 1.8 + 32) }
	AuxTemp2 = { useMetricOnInterface ? auxTemp2 : (auxTemp2 * 1.8 + 32) }
	AmbientTemp = { useMetricOnInterface ? ambientTemp : (ambientTemp * 1.8 + 32) }
	FuelTemp = { useMetricOnInterface ? fuelTemp : (fuelTemp * 1.8 + 32) }
	wb1Temp = { useMetricOnInterface ? wb1tempC : (wb1tempC * 1.8 + 32) }
	wb2Temp = { useMetricOnInterface ? wb2tempC : (wb2tempC * 1.8 + 32) }
	TCharge = { useMetricOnInterface ? sd_tCharge : (sd_tCharge * 1.8 + 32) }
	InternalMcuTemp = { useMetricOnInterface ? internalMcuTemperature : (internalMcuTemperature * 1.8 + 32) }

	; EGT output channels with metric/imperial support
	Egt1 = { useMetricOnInterface ? egt1 : (egt1 * 1.8 + 32) }
	Egt2 = { useMetricOnInterface ? egt2 : (egt2 * 1.8 + 32) }
	Egt3 = { useMetricOnInterface ? egt3 : (egt3 * 1.8 + 32) }
	Egt4 = { useMetricOnInterface ? egt4 : (egt4 * 1.8 + 32) }
	Egt5 = { useMetricOnInterface ? egt5 : (egt5 * 1.8 + 32) }
	Egt6 = { useMetricOnInterface ? egt6 : (egt6 * 1.8 + 32) }
	Egt7 = { useMetricOnInterface ? egt7 : (egt7 * 1.8 + 32) }
	Egt8 = { useMetricOnInterface ? egt8 : (egt8 * 1.8 + 32) }

	; Pressure output channels with metric/imperial support
	MapPressure = { useMetricOnInterface ? MAPValue : (MAPValue * 0.145038) }
	BaroPressure = { useMetricOnInterface ? baroPressure : (baroPressure * 0.145038) }
	OilPressure = { useMetricOnInterface ? oilPressure : (oilPressure * 0.145038) }
	LowFuelPressure = { useMetricOnInterface ? lowFuelPressure : (lowFuelPressure * 0.145038) }
	AcPressure = { useMetricOnInterface ? acPressure : (acPressure * 0.145038) }

	; Speed output channels with metric/imperial support
	vehicleSpeed = { useMetricOnInterface ? vehicleSpeedKph : (vehicleSpeedKph * 0.62137119) }

	; Axis scales for 3D tables with metric/imperial support
	cltHighXaxis = { useMetricOnInterface ? 120 : 248 }
	iatHighXaxis = { useMetricOnInterface ? 120 : 248 }
	mapHighXaxis = { useMetricOnInterface ? 100 : 14.5 }

	isEtb1Enabled = { etbFunctions1 == @@dc_function_e_DC_Throttle1@@ || etbFunctions2 == @@dc_function_e_DC_Throttle1@@ }
	isEtb2Enabled = { etbFunctions1 == @@dc_function_e_DC_Throttle2@@ || etbFunctions2 == @@dc_function_e_DC_Throttle2@@ }
	isEtbEnabled = { isEtb1Enabled || isEtb2Enabled }

	isTps1Primary = { tps1_1AdcChannel != @@ADC_CHANNEL_NONE@@ }
	isTps1Secondary = { tps1_2AdcChannel != @@ADC_CHANNEL_NONE@@ }
	isTps2Primary = { tps2_1AdcChannel != @@ADC_CHANNEL_NONE@@ }
	isTps2Secondary = { tps2_2AdcChannel != @@ADC_CHANNEL_NONE@@ }

	isPpsPrimary = { throttlePedalPositionAdcChannel != @@ADC_CHANNEL_NONE@@ }
	isPpsSecondary = { throttlePedalPositionSecondAdcChannel != @@ADC_CHANNEL_NONE@@ }

	; Closed Loop Fuel Correction / Short Term Fuel Trims
	isSTFT = { fuelClosedLoopCorrectionEnabled == 1 }

	; true when VE load axis is pressure-based (kPa/psi)
	veLoadIsPressure = { veOverrideMode == 1 || (veOverrideMode == 0 && fuelAlgorithm == 0) }
	; true when ignition load axis is pressure-based (kPa/psi)
	ignLoadIsPressure = { ignOverrideMode == 0 || ignOverrideMode == 1 }
	; unit label index: 0=psi, 1=kPa, 2=%
	ignLoadUnitIdx = { ignLoadIsPressure * useMetricOnInterface + (1 - ignLoadIsPressure) * 2 }
	; unit label index: 0=psi, 1=kPa, 2=%, 3=MAF, 4=%TPS, 5=Lua
	veLoadUnitIdx = { veLoadIsPressure * useMetricOnInterface + (1 - veLoadIsPressure) * (veOverrideMode == 2) * 2 + (1 - veLoadIsPressure) * (1 - (veOverrideMode == 2)) * (5 - 2 * (fuelAlgorithm == 1) - (fuelAlgorithm == 2)) }

