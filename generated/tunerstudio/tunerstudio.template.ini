[LoggerDefinition]
; valid logger types: composite, tooth, trigger, csv
	loggerDef = compositeLogger, "Composite Logger", composite
		startCommand = "@#TS_SET_LOGGER_SWITCH#@\x01"
		stopCommand  = "@#TS_SET_LOGGER_SWITCH#@\x02"
		dataReadCommand = "@#TS_SET_LOGGER_SWITCH#@\x03"
		dataReadTimeout = 10000 ; time in ms
		dataReadyCondition = { toothLogReady }
		continuousRead = true

		; recordDef = headerLen, footerLen, recordLen
		recordDef =	0,	0,	@@COMPOSITE_PACKET_SIZE@@

		;recordField  Name              HeaderName  startBit
		;             |                 |           |   bitCount
		;             |                 |           |   |   scale
		;             |                 |           |   |   |   units
		;             |                 |           |   |   |   |       updateCondition
		; these names are hard-coded inside TS
		; time
		recordField = refTime,			"RefTime",	0, 32,	0.001,	"ms"
		recordField = priLevel,			"PriLevel",	32,	1,	1,	"Flag"
		recordField = secLevel,			"SecLevel",	33,	1,	1,	"Flag"
		recordField = trigger,			"Trigger",	34,	1,	1,	"Flag"
		recordField = sync,				"Sync",		35,	1,	1,	"Flag"
		recordField = tdc,				"TDC",		36,	1,	1,	"Flag"

		; these are optional extras
		recordField = cam1,				"Cam 1",	33,	1,	1,	"Flag"
		recordField = cam2,				"Cam 2",	37,	1,	1,	"Flag"
		recordField = cam3,				"Cam 3",	38,	1,	1,	"Flag"
		recordField = cam4,				"Cam 4",	39,	1,	1,	"Flag"

		; byte of coils state
		recordField = coil1,			"Coil 1",	40,	1,	1,	"Flag"
		recordField = coil2,			"Coil 2",	41,	1,	1,	"Flag"
		recordField = coil3,			"Coil 3",	42,	1,	1,	"Flag"
		recordField = coil4,			"Coil 4",	43,	1,	1,	"Flag"
		recordField = coil5,			"Coil 5",	44,	1,	1,	"Flag"
		recordField = coil6,			"Coil 6",	45,	1,	1,	"Flag"
		recordField = coil7,			"Coil 7",	46,	1,	1,	"Flag"
		recordField = coil8,			"Coil 8",	47,	1,	1,	"Flag"

		; byte of injectors state
		recordField = inj1,				"Inj 1",	48,	1,	1,	"Flag"
		recordField = inj2,				"Inj 2",	49,	1,	1,	"Flag"
		recordField = inj3,				"Inj 3",	50,	1,	1,	"Flag"
		recordField = inj4,				"Inj 4",	51,	1,	1,	"Flag"
		recordField = inj5,				"Inj 5",	52,	1,	1,	"Flag"
		recordField = inj6,				"Inj 6",	53,	1,	1,	"Flag"
		recordField = inj7,				"Inj 7",	54,	1,	1,	"Flag"
		recordField = inj8,				"Inj 8",	55,	1,	1,	"Flag"

		; unused byte

		; it seems that TS also needs to know the diff.size of a tooth
		calcField = toothTime,			"ToothTime",	"ms", { time - pastValue(time, 1) }

		; The time field MUST be last according to ini spec document
		calcField = time,				"Time",			"ms", { refTime }

	loggerDef = compositeLogger, "Primary Tooth Time Logger", tooth
		startCommand = "@#TS_SET_LOGGER_SWITCH#@\x07"
		stopCommand  = "@#TS_SET_LOGGER_SWITCH#@\x02"
		dataReadCommand = "@#TS_SET_LOGGER_SWITCH#@\x03"
		dataReadTimeout = 10000 ; time in ms
		dataReadyCondition = { toothLogReady }
		continuousRead = true

		; recordDef = headerLen, footerLen, recordLen
		recordDef =	0,	0,	@@COMPOSITE_PACKET_SIZE@@

		; these names are hard-coded inside TS
		recordField = refTime,			"RefTime",	0, 32,	0.001,	"ms"
		recordField = priLevel,			"PriLevel",	32,	1,	1,	"Flag"

		; it seems that TS also needs to know the diff.size of a tooth
		calcField = toothTime,			"ToothTime",	"ms", { time - pastValue(time, 1) }

	loggerDef = triggerScope, "Trigger Oscilloscope", csv
		startCommand = "@#TS_SET_LOGGER_SWITCH#@\x04"
		stopCommand  = "@#TS_SET_LOGGER_SWITCH#@\x05"
		dataReadCommand = "@#TS_SET_LOGGER_SWITCH#@\x06"
		dataReadTimeout = 1000
		dataReadyCondition = { triggerScopeReady }
		continuousRead = true

		recordDef = 0, 0, 2
		recordField = channel1, @@TS_TRIGGER_SCOPE_CHANNEL_1_NAME@@, 0, 8, {6.6 / 255}, "v"
		recordField = channel2, @@TS_TRIGGER_SCOPE_CHANNEL_2_NAME@@, 8, 8, {6.6 / 255}, "v"

[VeAnalyze]

		;	tableName,  lambdaTargetTableName, lambdaChannel, egoCorrectionChannel, activeCondition
