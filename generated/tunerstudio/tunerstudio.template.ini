		filter = minCltFilter, "Minimum CLT", coolant,		<		, 60,		, true

		filter = deltaTps, "dTPS", deltaTps		>		, 50,		, true

		filter = VBatt, "VBatt", VBatt		<		, 12,		, true

		filter = minTps, "Minimum TPS", TPSValue,		<		, 1,		, true
